services:
  quota-dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: quota-dashboard
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - DB_PATH=/app/data/usage.db
      - JWT_SECRET=${JWT_SECRET:-super_secret_dev_key_change_me}
      - ADMIN_USERNAME=${ADMIN_USERNAME:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-admin}
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/usage"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s